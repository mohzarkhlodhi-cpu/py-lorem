agents:
  queue: local

steps:
  - label: ":python: Lorem sentence"
    key: sentence
    command: |
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      cat result.txt
      buildkite-agent annotate --style info --context sentence < result.txt
    plugins:
      - docker#v5.12.0:
          image: python:3.13
          mount-buildkite-agent: true
          propagate-uid-gid: true

  - label: ":python: Lorem paragraph"
    key: paragraph
    depends_on: sentence
    command: |
      python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > result2.txt
      cat result2.txt
      buildkite-agent annotate --style success --context paragraph < result2.txt
    plugins:
      - docker#v5.12.0:
          image: python:3.13
          mount-buildkite-agent: true
          propagate-uid-gid: true