agents:
  queue: local

steps:
  - label: ":python: Lorem sentence"
    key: sentence
    command: |
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      cat result.txt
    artifact_paths: "result.txt"
    plugins:
      - docker#v5.12.0:
          image: python:3.13
          propagate-uid-gid: true

  - label: ":memo: Annotate sentence"
    key: annotate-sentence
    depends_on: sentence
    command: |
      buildkite-agent artifact download result.txt .
      buildkite-agent annotate --style info --context sentence < result.txt

  - label: ":python: Lorem paragraph"
    key: paragraph
    depends_on: sentence
    command: |
      python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > result2.txt
      cat result2.txt
    artifact_paths: "result2.txt"
    plugins:
      - docker#v5.12.0:
          image: python:3.13
          propagate-uid-gid: true

  - label: ":package: Download & annotate paragraph"
    key: download
    depends_on: paragraph
    command: |
      buildkite-agent artifact download result2.txt .
      echo "Contents of result2.txt:"
      cat result2.txt
      buildkite-agent annotate --style success --context paragraph < result2.txt

  - label: ":docker: Build & push image"
    key: image
    depends_on: download
    command: |
      REGISTRY="packages.buildkite.com/mohzarkhlodhi-cpu/lorem-images"
      IMAGE="$$REGISTRY/py-lorem"

      echo "--- :docker: Building image"
      docker build -t "$$IMAGE:$$BUILDKITE_BUILD_NUMBER" -t "$$IMAGE:latest" .

      echo "--- :lock: Logging in with OIDC"
      buildkite-agent oidc request-token --audience "https://$$REGISTRY" --lifetime 299 \
        | docker login "$$REGISTRY" --username buildkite --password-stdin

      echo "--- :rocket: Pushing image"
      docker push "$$IMAGE:$$BUILDKITE_BUILD_NUMBER"
      docker push "$$IMAGE:latest"

      echo "--- :white_check_mark: Testing pushed image"
      docker run --rm "$$IMAGE:$$BUILDKITE_BUILD_NUMBER"

      docker logout "$$REGISTRY"
